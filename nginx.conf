# ==============================================================================
# Nginx Hardened Production Configuration for Roshd Platform (roshd.digiral.ir)
# Path on server: /etc/nginx/sites-available/roshd.digiral.ir.conf
# ==============================================================================

# 1. HTTP Server - Permanent 301 Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name roshd.digiral.ir;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Secure Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name roshd.digiral.ir;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/roshd.digiral.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roshd.digiral.ir/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum client payload size (150MB for video lectures & assignments)
    client_max_body_size 150M;

    # High-Performance Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ----------------- STATIC ASSET & FILE SECURITY -----------------
    
    # ONLY truly public media (images, banners, lecture videos) are served statically
    location /uploads/images/ {
        alias /var/www/roshd/backend/uploads/images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location /uploads/videos/ {
        alias /var/www/roshd/backend/uploads/videos/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # CRITICAL SECURITY: Private financial receipts and homework submissions
    # are NEVER statically served by Nginx! They are forwarded to Express
    # where JWT authentication and ownership authorization are strictly enforced.
    location /uploads/receipts/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/homeworks/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Frontend Single Page Application (SPA)
    location / {
        root /var/www/roshd/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Static asset long-term cache
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public, max-age=15552000, immutable";
        }
    }
}
