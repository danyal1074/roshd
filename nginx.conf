# Nginx Configuration for Rosh Platform
# /etc/nginx/sites-available/rosh-platform.conf

server {
    listen 80;
    server_name roshd.digiral.ir;

    # Maximum upload size for video courses and PDF homeworks
    client_max_body_size 150M;

    # Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Uploads direct static serving with caching & video byte-range support
    location /uploads/ {
        alias /var/www/rosh-platform/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # API and dynamic requests forwarded to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Frontend Single Page Application (SPA) routing
    location / {
        root /var/www/rosh-platform/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Static assets cache
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public, max-age=15552000, immutable";
        }
    }
}
