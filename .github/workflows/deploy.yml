# Deploy roshd.digiral.ir when main changes.
# Connection details are repository secrets only:
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY
#   optional: SSH_PORT (default 22), SSH_KNOWN_HOSTS
# The remote deploy script exits 1 if http://127.0.0.1:5000/api/health does not succeed.

name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Syntax-check deploy scripts and sudoers
        run: |
          bash -n deploy-on-existing-server.sh
          bash -n scripts/pull-deploy.sh
          bash -n .github/scripts/ssh-deploy.sh
          chmod 440 scripts/sudoers-roshd-deploy
          visudo -cf scripts/sudoers-roshd-deploy

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Check backend JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find backend -name '*.js' -not -path '*/node_modules/*' -print0)

      - name: Install backend production dependencies
        working-directory: backend
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  deploy:
    name: Deploy on VPS
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: roshd-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout deploy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: SSH and run deploy script (fails if /api/health fails)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash .github/scripts/ssh-deploy.sh
