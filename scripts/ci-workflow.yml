name: Roshd Platform Production CI

on:
  push:
    branches: [ main, fix/production-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build, Security Audit & Automated Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package.json
            backend/package.json
            frontend/package.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci --prefer-offline --no-audit

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm run build

      - name: Secret Leak Prevention Guard
        run: |
          echo "Scanning codebase for forbidden hardcoded secrets..."
          # Fail if legacy weak secrets or IP patterns are present in code
          ! grep -rn "123456" backend/ frontend/src/ 2>/dev/null || (echo "FAILED: 123456 found in source code" && exit 1)
          ! grep -rn "c6khenbR" backend/ scripts/ 2>/dev/null || (echo "FAILED: Root password found in source code" && exit 1)
          ! grep -rn "89.46.217" backend/ scripts/ 2>/dev/null || (echo "FAILED: Raw server IP found in source code" && exit 1)
          echo "Secret scan passed cleanly."

      - name: Run SQLite Atomic Backup & Restore Tests
        run: |
          node scripts/test_backup_restore.js

      - name: Start Background Backend Server for Integration Tests
        env:
          JWT_SECRET: "ci_pipeline_secure_random_jwt_secret_hex_key_minimum_48_bytes_length_required_here_12345678"
          PORT: 5000
          HOST: "127.0.0.1"
          NODE_ENV: "test"
          SKIP_RATE_LIMIT: "true"
        run: |
          node backend/server.js &
          sleep 3
          curl -sf http://127.0.0.1:5000/api/health || exit 1

      - name: Run Automated Security Test Suite
        env:
          BASE_URL: "http://127.0.0.1:5000"
        run: |
          node scripts/test_security.js

      - name: Run Automated Functional Workflow Test Suite
        env:
          BASE_URL: "http://127.0.0.1:5000"
        run: |
          node scripts/test_functional.js
