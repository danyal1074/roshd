# GitHub Actions Workflow for roshd.digiral.ir
# برای فعال‌سازی در گیت‌هاب، کافیست این فایل را در مسیر .github/workflows/deploy.yml قرار دهید
# (توجه: توکن دسترسی شما در گیت‌هاب باید تیک دسترسی workflow را داشته باشد)

name: Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy to VPS (roshd.digiral.ir)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Starting automated deployment for roshd.digiral.ir..."
            cd /var/www/rosh-platform || exit 1

            echo "📥 Pulling latest code..."
            git pull origin main

            if [ -f "docker-compose.yml" ] && command -v docker &> /dev/null; then
                echo "🐳 Rebuilding Docker containers..."
                docker compose up -d --build
            else
                echo "⚙️ Rebuilding frontend and reloading PM2..."
                cd frontend && npm install && npm run build && cd ..
                cd backend && npm install --production && cd ..
                pm2 startOrReload ecosystem.config.js
                pm2 save
            fi

            echo "✅ Deployment completed successfully! roshd.digiral.ir is updated."
