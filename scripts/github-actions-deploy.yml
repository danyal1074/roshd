# Copy to .github/workflows/deploy.yml after configuring the settings below.
name: Deploy Roshd
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roshd-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy verified main commit
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.SERVER_PATH }}
          DEPLOY_MODE: ${{ vars.DEPLOY_MODE }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          envs: DEPLOY_PATH,DEPLOY_MODE,DEPLOY_SHA
          command_timeout: 20m
          script: |
            set -eu
            test -n "$DEPLOY_PATH"
            case "$DEPLOY_MODE" in pm2|docker) ;; *) echo 'Set DEPLOY_MODE to pm2 or docker'; exit 1 ;; esac
            cd "$DEPLOY_PATH"
            test "$(git branch --show-current)" = main
            git diff --quiet
            git diff --cached --quiet
            git fetch origin main
            # Avoid deploying an older queued commit over a newer deployment.
            git merge --ff-only "$DEPLOY_SHA"
            if [ "$DEPLOY_MODE" = docker ]; then
              docker compose build
              docker compose up -d
            else
              node --version
              npm --prefix backend ci --omit=dev --no-audit
              npm --prefix frontend ci --no-audit
              node scripts/test_review_fixes.cjs
              # Root build also copies dist, including fonts, to backend/public.
              npm run build
              pm2 startOrReload ecosystem.config.js
              pm2 save
            fi
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:5000/api/health

